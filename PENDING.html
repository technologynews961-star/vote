const tableBody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const countDisplay = document.getElementById('countDisplay');
const noResult = document.getElementById('noResult');

function highlight(text, query) {
  if (!query) return text;
  const idx = text.toString().toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return text.toString().substring(0, idx) +
         "<mark>" + text.toString().substring(idx, idx + query.length) + "</mark>" +
         text.toString().substring(idx + query.length);
}

function renderTable(rows, query) {
  tableBody.innerHTML = '';
  if (rows.length === 0) {
    noResult.style.display = 'block';
    document.getElementById('dataTable').style.display = 'none';
  } else {
    noResult.style.display = 'none';
    document.getElementById('dataTable').style.display = 'table';
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${highlight(r["Sr No"], query)}</td><td>${highlight(r["Name"], query)}</td>`;
      tableBody.appendChild(tr);
    });
  }
  countDisplay.textContent = `Showing ${rows.length} of ${data.length} records`;
}

searchInput.addEventListener('input', function() {
  const query = this.value.trim().toLowerCase();
  if (query === '') {
    renderTable(data, '');
    return;

  const filtered = data.filter(r =>
    r["Sr No"].toString().toLowerCase().includes(query) ||
    r["Name"].toLowerCase().includes(query)
  );
  renderTable(filtered, query);
});
